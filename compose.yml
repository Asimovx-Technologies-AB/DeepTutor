name: deeptutor-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: deeptutor
      POSTGRES_USER: deeptutor
      POSTGRES_PASSWORD: deeptutor_local_only
    ports:
      - "5432:5432"
    volumes:
      - deeptutor_postgres_data:/var/lib/postgresql/data
      - ./infra/local/postgres-init.sql:/docker-entrypoint-initdb.d/01-postgres-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeptutor -d deeptutor"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  deeptutor_postgres_data:
