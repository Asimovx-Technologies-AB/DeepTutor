name: infra-plan

# Every change to the Terraform config is formatted, validated and planned
# against real Azure state before a human reads the PR. This is the only
# validation gate that exists — nothing else runs `terraform` in this repo.
on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra-plan.yml"
  workflow_dispatch:

permissions:
  id-token: write # OIDC federated login to Azure — no stored credentials
  contents: read
  pull-requests: write

concurrency:
  group: infra-plan-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: infra/terraform

env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan:
    name: plan (dev)
    runs-on: ubuntu-latest
    environment: dev-plan

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=dev.terraform.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -input=false \
            -var-file=envs/dev.tfvars \
            -out=tfplan | tee plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('infra/terraform/plan.txt', 'utf8');
            // GitHub caps comments at 65536 chars; keep the tail, which holds
            // the summary line reviewers actually look for.
            const body = raw.length > 60000
              ? '_(plan truncated — see the job log for the full output)_\n\n' + raw.slice(-60000)
              : raw;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Terraform plan — dev\n\n```terraform\n' + body + '\n```',
            });

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: infra/terraform/tfplan
          retention-days: 5
