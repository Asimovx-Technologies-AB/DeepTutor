name: deploy-backend

# Builds the API image inside ACR (no Docker daemon, no registry credentials)
# and points the Container App at the new tag.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-dev
  cancel-in-progress: true

env:
  RESOURCE_GROUP: rg-deeptutor-dev
  CONTAINER_APP: ca-deeptutor-dev-api
  IMAGE_REPO: deeptutor-api

jobs:
  deploy:
    name: build and deploy (dev)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve registry
        id: acr
        run: |
          name=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          if [ -z "$name" ]; then
            echo "No container registry in $RESOURCE_GROUP — run infra-apply first." >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "login_server=$(az acr show --name "$name" --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"

      # `az acr build` ships the context to ACR and builds there: no Docker
      # layer caching to manage on the runner, and the Basic SKU absorbs it.
      #
      # Run from backend/ rather than passing `./backend` as the context: the
      # CLI reads --file itself, to inject it into the tarball it uploads, and
      # resolves that path against the working directory instead of the context
      # root. From the repo root `--file Dockerfile.slim` therefore looked for
      # it beside the workflow and failed. With both arguments relative to
      # backend/ the two resolve the same way.
      - name: Build image in ACR
        working-directory: backend
        run: |
          az acr build \
            --registry "${{ steps.acr.outputs.name }}" \
            --image "${IMAGE_REPO}:${GITHUB_SHA}" \
            --image "${IMAGE_REPO}:latest" \
            --file Dockerfile.slim \
            .

      - name: Roll out new revision
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ steps.acr.outputs.login_server }}/${IMAGE_REPO}:${GITHUB_SHA}" \
            --output none

      - name: Smoke test
        run: |
          app=(--name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP")
          fqdn=$(az containerapp show "${app[@]}" --query properties.configuration.ingress.fqdn -o tsv)

          # An empty FQDN means ingress is off or the app is gone. Without this
          # guard the loop curls "https:///" and reports HTTP 000 twenty times,
          # which looks like a cold start that never ends.
          if [ -z "$fqdn" ]; then
            echo "No ingress FQDN on $CONTAINER_APP — ingress is disabled or the app does not exist." >&2
            exit 1
          fi
          url="https://${fqdn}/"
          echo "Probing $url"

          # min_replicas may be 0 — the first request pays the cold start.
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" || true)
            if [ "$code" = "200" ]; then
              echo "OK after ${attempt} attempt(s): $url"
              echo "API: $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code}"
            sleep 15
          done
          exit 1

      # `logs show --type console` needs a live replica, so on the failure that
      # actually happens — a revision that never started one — it prints
      # "Could not find a replica for this app" and nothing else. Revision state
      # and system logs are where provisioning, image-pull, secret-resolution
      # and OOM failures are reported.
      - name: Diagnose failed rollout
        if: failure()
        run: |
          app=(--name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP")
          q='[].{name:name,active:properties.active,replicas:properties.replicas,provisioning:properties.provisioningState,health:properties.healthState,image:properties.template.containers[0].image}'

          echo "::group::Revisions"
          az containerapp revision list "${app[@]}" --query "$q" -o table || true
          echo "::endgroup::"

          revision=$(az containerapp show "${app[@]}" --query properties.latestRevisionName -o tsv)
          echo "Latest revision: ${revision:-<none>}"

          echo "::group::Replicas on $revision"
          az containerapp replica list "${app[@]}" --revision "$revision" -o table || true
          echo "::endgroup::"

          echo "::group::System logs (provisioning, image pull, probe failures, OOM)"
          az containerapp logs show "${app[@]}" --type system --tail 200 || true
          echo "::endgroup::"

          echo "::group::Console logs (only if a replica ever started)"
          az containerapp logs show "${app[@]}" --type console --tail 200 || true
          echo "::endgroup::"
